name: AniworldIOS
options:
  bundleIdPrefix: com.aniworldios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
packages:
  AniworldKit:
    path: .
targets:
  AniworldIOS:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
        optional: true
    dependencies:
      - package: AniworldKit
        product: AniworldKit
    settings:
      base:
        PRODUCT_NAME: AniWorld
        PRODUCT_BUNDLE_IDENTIFIER: com.aniworldios.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "NO"
    # Info.plist is generated by XcodeGen into App/Info.plist (git-ignored).
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: AniWorld
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.aniworldios.app.refresh
        UIRequiresFullScreen: false
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
# Shared scheme so `xcodebuild -scheme AniworldIOS` works on a fresh checkout.
schemes:
  AniworldIOS:
    build:
      targets:
        AniworldIOS: all
    run:
      config: Debug
    archive:
      config: Release
