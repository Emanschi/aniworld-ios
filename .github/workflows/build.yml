name: Build

# The IPA is built only for releases: pushing a tag vX.Y.Z that points at a commit on main
# builds the IPA and publishes the GitHub Release (IPA, AltStore source, notes from
# App/Resources/PatchNotes.json). Pushes to main/dev/feature branches and pull requests
# start nothing, to save Actions minutes (private repo, macOS = 10x).
# A manual start (Run workflow) builds a test IPA as artifact only, without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core-tests:
    name: AniworldKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Cache SwiftPM / build
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-linux-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-linux-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  ipa:
    name: Unsigned IPA (iOS)
    runs-on: macos-15
    # Release/IPA upload needs write access only for tag builds.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Releases only from main: the tagged commit must be part of origin/main, and the
      # version needs patch notes (they become the release description).
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Merge dev into main first, then tag main."
            exit 1
          fi
          python3 scripts/release-notes.py --version "${GITHUB_REF_NAME#v}" \
            --repo "${{ github.repository }}" --out build-release-notes.md

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: |
          brew install xcodegen xcbeautify
          xcodebuild -version
          swift --version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-ios-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-ios-

      - name: Derive version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build IPA
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NR: ${{ github.run_number }}
        run: |
          set -o pipefail
          bash scripts/build-ipa.sh

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AniWorld-ipa
          path: build/AniWorld.ipa
          if-no-files-found: error

      # On tags: generate a filled AltStore source and publish both with the release.
      # The stable source URL is  .../releases/latest/download/altstore-source.json
      # (no commit back to main needed).
      - name: Generate AltStore source
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 scripts/update-altstore-source.py \
            --ipa build/AniWorld.ipa \
            --version "${{ steps.ver.outputs.version }}" \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --out build/altstore-source.json
          cat build/altstore-source.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/AniWorld.ipa
            build/altstore-source.json
          name: AniWorld ${{ steps.ver.outputs.version }}
          body_path: build-release-notes.md
